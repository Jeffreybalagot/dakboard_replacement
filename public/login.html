<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Dashboard Settings</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  form {
    background: #fff;
    border: 1px solid #e2e2e6;
    border-radius: 14px;
    padding: 32px;
    width: 280px;
  }
  h1 { font-size: 1.1rem; margin: 0 0 16px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e2e2e6;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    background: #f2994a;
    color: #fff;
    border: none;
    padding: 11px;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  #error { color: #b3261e; font-size: 0.85rem; margin-bottom: 10px; display: none; }
</style>
</head>
<body>
<form id="login-form">
  <h1>Dashboard Settings</h1>
  <div id="error">Incorrect password.</div>
  <input type="password" id="password" placeholder="Password" autofocus />
  <button type="submit">Sign in</button>
</form>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const password = document.getElementById("password").value;
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    if (res.ok) {
      const next = new URLSearchParams(window.location.search).get("next") || "/config.html";
      window.location.href = next;
    } else {
      document.getElementById("error").style.display = "block";
    }
  });
</script>
</body>
</html>
